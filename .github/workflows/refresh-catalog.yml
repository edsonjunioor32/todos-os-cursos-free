name: Buscar e publicar cursos diariamente

on:
  schedule:
    - cron: "17 6 * * *" # Todos os dias às 03h17 no horário de Brasília (UTC-3)
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cursos-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar navegador para os portais dinâmicos
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Buscar cursos novos nos portais
        run: node scripts/refresh-catalog.mjs

      - name: Salvar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- courses.json; then
            echo "Nenhuma alteração no catálogo."
          else
            git add courses.json
            git commit -m "Atualiza catálogo de cursos"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html app.js styles.css theme.js favicon.svg courses.json _site/
          cp -R assets/. _site/assets/

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
